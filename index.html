<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nébula</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- BARRA DE NAVEGACIÓN -->
    <header class="encabezado">
        <a href="#inicio" class="enlace-logotipo">
            <img src="assets/imagenes/venus.png" alt="Logotipo Oficial de Nébula"
            loading="lazy" width="50" height="50">
        </a>
        <nav class="lista-menu">
            
                <a href="#inicio">Inicio</a>
                <a href="#video">Video</a>
                <a href="#audio">Audio</a>
                <a href="#contacto">Contacto</a>
                <a href="#galeria">Galería</a>
                <a href="#pie-pagina">Pie de Página</a>
        </nav>
    </header>

    <main>
        <!-- HERO -->
        <section id="inicio" class="seccion-hero">

            <img src="assets/imagenes/fondo.webp" alt="Fondo Nébula" class="imagen-fondo"
            loading="lazy" width="1920" height="1080">

            <div class="contenido-hero">

                <h1 class="titulo-principal">NÉBULA</h1>

            </div>

        </section>

        <!-- GALERÍA -->
        <section id="galeria" class="seccion-galeria">

            <h2 class="titulo-galeria">Galería de Imágenes</h2>

            <div class="galeria-contenedor">
                <figure class="tarjeta-galeria">
                    <img src="assets/imagenes/astronauta.webp" alt="Astronauta en marte" class="imagen-miniatura"
                    loading="lazy" width="400" height="250">
                    <figcaption class="pie-imagen"> Mollyroselee en <a href="https://pixabay.com/photos/astronaut-planets-mars-earth-9056443/" target="_blank" rel="">Pixabay</a> (Licencia Pixabay /
                    Dominio público)

                    </figcaption>

                </figure>

                <figure class="tarjeta-galeria">
                    <img src="assets/imagenes/dama.webp" alt="dama con planetas" class="imagen-miniatura"
                    loading="lazy" width="400" height="250">
                    <figcaption class="pie-imagen"><figcaption class="pie-imagen"> Alexas_Fotos en <a href="https://pixabay.com/illustrations/ai-generated-woman-fantasy-planets-8964431/ "target="_blank" rel="">Pixabay</a>
                        (Licencia Pixabay / Dominio público)</figcaption>
                </figure>

                <figure class="tarjeta-galeria">
                    <img src="assets/imagenes/planetas.webp" alt="planetas" class="imagen-miniatura"
                    loading="lazy" width="400" height="250">
                    <figcaption class="pie-imagen">JuliusH en <a href="https://pixabay.com/illustrations/ai-generated-space-planets-universe-8469846/ " target="_blank"
                        rel="">Pixabay</a>
                    (Licencia Pixabay / Dominio público)</figcaption>
                </figure>

            </div>
        </section>

        <p id="video" class="video">Video de Presentación</p>
        <video controls class="video-presentacion"
        poster="assets/imagenes/poster.webp"
        autoplay loop muted>
            <source src="assets/video/presentacion.mp4"
            type="video/mp4">
        </video>

        <p id="audio" class="audio">Audio Ambiental</p>
        <audio controls preload="metadata" class="audio-ambiente">
            <source src="assets/audio/audio-ambiental.mp3" type="audio/mp3">
        </audio>

        <!-- CONTACTO -->
        <section id="contacto" class="boton-contacto">
            <h2 class="contacto">Contacto</h2>
            <img src="assets/imagenes/contacto.webp" alt="Contacto" class="imagen-contacto"
            loading="lazy" width="400" height="250">
        </section>

    </main>

    <!--PIE DE PÁGINA -->
    <footer id="pie-pagina" class="pie-pagina">
        <div class="informacion-pie">
            <h3>Nébula</h3>
        </div>
        <p>&copy; 2026 Nébula. Todos los derechos reservados.</p>
    </footer>

</body>

</html>
